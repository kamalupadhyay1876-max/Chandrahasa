<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Chandrahasa</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div data-layout="header"></div>
<main class="auth-wrap">
  <aside class="auth-side">
    <img src="/assets/img/classic-necklace.jpg" alt="Chandrahasa classic herringbone necklace" data-fb="/assets/img/necklaces.webp">
    <div class="auth-side-inner">
      <h1>Lost your<br><em style="color:#d9c07a">key?</em></h1>
      <p>Happens to the best of us — the bench forgives.</p>
    </div>
  </aside>
  <div class="auth-main">
    <div class="auth-card">
      <h2>Reset password</h2>
      <p class="sub">We’ll send a secure, 30-minute link to your inbox.</p>
      <div class="form-error" id="authError"></div>
      <form id="forgotForm" novalidate>
        <div class="field"><label for="forgotEmail">Email</label><input id="forgotEmail" type="email" required autocomplete="email" placeholder="you@example.com"></div>
        <button type="submit" class="btn btn-dark btn-block" id="forgotBtn">Send Reset Link</button>
      </form>
      <div class="demo-box hidden" id="resetLinkBox"></div>
      <p class="auth-alt"><a href="/login">← Back to sign in</a></p>
    </div>
  </div>
</main>
<div data-layout="footer"></div>
<script src="/js/layout.js"></script>

<script src="/js/store.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
