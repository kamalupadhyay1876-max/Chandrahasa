<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Chandrahasa | Divine Jewellery</title>
<meta name="description" content="Join the Chandrahasa Circle — track orders, save wishlists and unlock member-only atelier drops.">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div data-layout="header"></div>
<main class="auth-wrap">
  <aside class="auth-side">
    <img src="/assets/img/bracelets.webp" alt="Hand-forged Chandrahasa kada" data-fb="/assets/img/artisan.jpg">
    <div class="auth-side-inner">
      <h1>Step onto<br>the <em style="color:#d9c07a">bench.</em></h1>
      <p>“Find a piece that feels like it belongs to you.”</p>
    </div>
  </aside>
  <div class="auth-main">
    <div class="auth-card">
      <h2>Create account</h2>
      <p class="sub">Create your secure Chandrahasa customer account to track orders and save your favourite pieces.</p>
      <div class="form-error" id="authError"></div>
      <form id="signupForm" novalidate>
        <div class="field"><label for="suName">Full name *</label><input id="suName" required autocomplete="name" placeholder="Priya Sharma"></div>
        <div class="field-row">
          <div class="field"><label for="suEmail">Email *</label><input id="suEmail" type="email" required autocomplete="email" placeholder="you@example.com"></div>
          <div class="field"><label for="suPhone">Phone *</label><input id="suPhone" type="tel" required autocomplete="tel" placeholder="+91 98XXX XXXXX" inputmode="tel"></div>
        </div>
        <div class="field"><label for="suPassword">Password *</label><input id="suPassword" type="password" required minlength="16" autocomplete="new-password" placeholder="At least 16 characters"></div>
        <div class="field"><label for="suPassword2">Confirm password *</label><input id="suPassword2" type="password" required minlength="16" autocomplete="new-password" placeholder="Repeat your password"></div>
        <button type="submit" class="btn btn-dark btn-block" id="signupBtn">Create Account</button>
      </form>
      <p class="auth-alt">Already in the Circle? <a href="/login">Sign in →</a></p>
    </div>
  </div>
</main>
<div data-layout="footer"></div>
<script src="/js/layout.js"></script>

<script src="/js/store.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
