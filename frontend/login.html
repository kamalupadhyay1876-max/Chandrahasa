<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Chandrahasa | Divine Jewellery</title>
<meta name="description" content="Sign in to your Chandrahasa account — track orders, manage your wishlist and addresses, and check out faster.">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/premium-upgrade.css">
</head>
<body>
<div data-layout="header"></div>
<main class="auth-wrap">
  <aside class="auth-side">
    <img src="/assets/img/artisan.jpg" alt="Jewellery craftsmanship detail" data-fb="/assets/img/necklaces.webp">
    <div class="auth-side-inner">
      <h1>Welcome back<br>to the <em style="color:#d9c07a">bench.</em></h1>
      <p>“Silver keeps the memory of the hand that raised it.”</p>
    </div>
  </aside>
  <div class="auth-main">
    <div class="auth-card">
      <h2>Sign in</h2>
      <p class="sub">Your orders, your wishlist, your bench — one sign-in away.</p>
      <div class="form-error" id="authError"></div>
      <form id="loginForm" novalidate>
        <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" required autocomplete="email" placeholder="you@example.com"></div>
        <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" required autocomplete="current-password" placeholder="••••••••" minlength="8"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap">
          <label class="filter-opt" style="padding:0"><input type="checkbox" id="rememberMe" checked> Remember me</label>
          <a href="/forgot-password" style="font-size:13px;color:var(--gold-deep);font-weight:700;text-decoration:none">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-dark btn-block" id="loginBtn">Sign In</button>
      </form>
      <p class="auth-alt">New to Chandrahasa? <a href="/signup">Create an account →</a></p>
    </div>
  </div>
</main>
<div data-layout="footer"></div>
<script src="/js/layout.js"></script>

<script src="/js/store.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
