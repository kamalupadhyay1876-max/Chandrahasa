<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a New Password — Chandrahasa</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/premium-upgrade.css">
</head>
<body>
<div data-layout="header"></div>
<main class="auth-wrap">
  <aside class="auth-side">
    <img src="/assets/img/triple-band-ring.jpg" alt="Chandrahasa triple band silver ring" data-fb="/assets/img/rings.webp">
    <div class="auth-side-inner">
      <h1>A fresh<br><em style="color:#d9c07a">beginning.</em></h1>
      <p>Choose something memorable — sixteen characters minimum.</p>
    </div>
  </aside>
  <div class="auth-main">
    <div class="auth-card">
      <h2>New password</h2>
      <p class="sub">This link was valid for 30 minutes and is single-use.</p>
      <div class="form-error" id="authError"></div>
      <form id="resetForm" novalidate>
        <div class="field"><label for="resetPassword">New password *</label><input id="resetPassword" type="password" required minlength="16" autocomplete="new-password" placeholder="At least 16 characters"></div>
        <div class="field"><label for="resetPassword2">Confirm password *</label><input id="resetPassword2" type="password" required minlength="8" autocomplete="new-password" placeholder="Repeat it"></div>
        <button type="submit" class="btn btn-dark btn-block" id="resetBtn">Update Password</button>
      </form>
      <p class="auth-alt"><a href="/login">← Back to sign in</a></p>
    </div>
  </div>
</main>
<div data-layout="footer"></div>
<script src="/js/layout.js"></script>

<script src="/js/store.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
