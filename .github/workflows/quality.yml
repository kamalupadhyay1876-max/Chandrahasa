name: Chandrahasa quality gates
on:
  push:
    branches: [main, feat/admin-control-backup-media]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run syntax
      - run: npm run audit
      - run: npm run test:schema
      - name: Check JavaScript syntax across frontend
        working-directory: .
        run: |
          find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
